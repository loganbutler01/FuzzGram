[project]
name = "fuzzgram"
version = "0.1.0"
description = "Tiny grammar-based fuzzer: expand a grammar into random valid inputs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fuzzgram = "fuzzgram.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
